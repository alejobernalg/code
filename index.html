<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Último Espartano</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <canvas id="screen" width="320" height="224"></canvas>
    <div id="scanlines"></div>
    <button id="muteBtn" title="Silenciar sonido">🔊</button>

    <div id="touchControls">
      <div class="tc-dpad">
        <button class="tc-btn tc-square" data-code="ArrowLeft" aria-label="Mover izquierda">◀</button>
        <button class="tc-btn tc-square" data-code="ArrowRight" aria-label="Mover derecha">▶</button>
      </div>
      <div class="tc-actions">
        <button class="tc-btn tc-round" data-code="KeyC" aria-label="Cubrirse">🛡</button>
        <button class="tc-btn tc-round" data-code="KeyX" aria-label="Jabalina">🗡</button>
        <button class="tc-btn tc-round" data-code="ArrowUp" aria-label="Saltar">▲</button>
        <button class="tc-btn tc-round tc-attack" data-code="KeyZ" aria-label="Atacar (mantén para giro)">⚔</button>
      </div>
    </div>
  </main>
  <p id="hint">
    ←→ MOVER · ↑/ESPACIO SALTAR · Z ATAQUE (MANTÉN PARA GIRO) · X JABALINA · C CUBRIRSE
  </p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
